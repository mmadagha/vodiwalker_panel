app = "vodiwalker-panel"
primary_region = "fra"
kill_timeout = '24h'

[env]
DATA_DIR = "/data"
TCP_LISTEN_PORT = "6543"

[[mounts]]
destination = "/data"
source = "vodiwalker_data"

[[services]]
auto_start_machines = true
auto_stop_machines = true
internal_port = 8_000
min_machines_running = 0
processes = [ "app" ]
protocol = "tcp"

  [services.concurrency]
  hard_limit = 400
  soft_limit = 200
  type = "connections"

  [[services.ports]]
  force_https = true
  handlers = [ "http" ]
  port = 80

  [[services.ports]]
  handlers = [ "tls", "http" ]
  port = 443

[[services]]
auto_start_machines = true
auto_stop_machines = true
internal_port = 6_543
min_machines_running = 0
processes = [ "app" ]
protocol = "tcp"

  [services.concurrency]
  hard_limit = 400
  soft_limit = 200
  type = "connections"

  [[services.ports]]
  port = 6_543

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "1gb"
memory_mb = 1_024
